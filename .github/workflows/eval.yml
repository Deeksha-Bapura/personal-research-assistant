name: RAG eval

# Scores the stage-1 RAG chat pipeline on every PR that touches it.
#  - retrieval: always runs (no secrets needed, deterministic) and fails the PR
#    if retrieval accuracy drops more than 3 points below the committed baseline.
#  - full: answer / citation accuracy and time-to-first-token with Claude.
#    Runs only when the ANTHROPIC_API_KEY repo secret is set (not on fork PRs).
#  - sweep: manual (Actions tab -> RAG eval -> Run workflow) to compare every
#    config in backend/eval/configs side by side.

on:
  pull_request:
    paths:
      - "backend/rag.py"
      - "backend/server.py"
      - "backend/eval/**"
      - ".github/workflows/eval.yml"
  workflow_dispatch:
    inputs:
      sweep:
        description: "Also run the retrieval sweep over every config in backend/eval/configs"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: rag-eval-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/eval/requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('backend/rag.py', 'backend/eval/configs/*.json') }}
          restore-keys: hf-${{ runner.os }}-

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r eval/requirements.txt

      - name: Retrieval eval (gate)
        run: |
          python eval/run_eval.py --retrieval-only \
            --compare eval/results/baseline_retrieval.json --max-drop 3 \
            --out eval-retrieval.json --markdown "$GITHUB_STEP_SUMMARY"

      - name: Retrieval sweep
        if: github.event_name == 'workflow_dispatch' && inputs.sweep
        run: |
          python eval/run_eval.py --sweep eval/configs/*.json --quiet \
            --out eval-sweep.json --markdown "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-retrieval
          path: backend/eval-*.json
          if-no-files-found: ignore

  full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/eval/requirements.txt

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('backend/rag.py', 'backend/eval/configs/*.json') }}
          restore-keys: hf-${{ runner.os }}-

      - name: Install dependencies
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r eval/requirements.txt

      - name: Full eval with Claude (answer, citation, time to first token)
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "### Full eval skipped: add an ANTHROPIC_API_KEY repository secret to enable it." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python eval/run_eval.py --grader claude \
            --compare eval/results/baseline_full.json --max-drop 5 \
            --out eval-full.json --markdown "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-full
          path: backend/eval-full.json
          if-no-files-found: ignore
